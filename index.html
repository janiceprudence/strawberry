<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postie - Strawberry Mail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=MonteCarlo&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <img class="wordmark-image" src="assets/postie-wordmark.png" alt="Postie" />
          <p class="parcel-meta">Strawberry Mail</p>
        </div>

        <div class="mail-stage" aria-live="polite">
          <div class="sky-window">
            <div class="dream-grid"></div>
            <div class="cloud cloud-one"></div>
            <div class="cloud cloud-two"></div>
            <div class="glass-mailbox" id="mailbox">
              <span class="mailbox-flag" aria-hidden="true"></span>
              <span class="mailbox-screen">New parcel</span>
              <span class="mailbox-slot"></span>
            </div>
          </div>
          <div class="stage-copy">
            <h1 id="app-title" class="brand-wordmark">Postie</h1>
            <p class="parcel-status" id="stage-status">
              There is something soft waiting in your mailbox.
            </p>
          </div>
        </div>
      </section>

      <section class="workspace" aria-label="Postie app">
        <div class="panel-heading">
          <p class="parcel-meta">Special delivery from Sam</p>
          <h2 class="parcel-title" id="flow-title">A little world, folded just for you.</h2>
          <p class="parcel-body" id="flow-copy">Tap the parcel to see what Sam tucked inside.</p>
        </div>

        <div class="parcel-theater" id="parcel-theater">
          <div class="parcel-scene" id="parcel-scene">
            <div class="paper-flap paper-flap-top" aria-hidden="true">
              <span class="paper-crease"></span>
            </div>
            <div class="paper-flap paper-flap-right" aria-hidden="true">
              <span class="paper-crease"></span>
            </div>
            <div class="paper-flap paper-flap-bottom" aria-hidden="true">
              <span class="paper-crease"></span>
            </div>
            <div class="paper-flap paper-flap-left" aria-hidden="true">
              <span class="paper-crease"></span>
            </div>

            <div class="parcel-reveal" id="parcel-reveal" aria-hidden="true">
              <svg
                class="dream-landscape"
                viewBox="0 0 400 260"
                role="img"
                aria-labelledby="dream-title dream-desc"
                preserveAspectRatio="xMidYMid slice"
              >
                <title id="dream-title">A dream meadow at sunset</title>
                <desc id="dream-desc">A flower-filled train opens onto a glowing dream landscape.</desc>
                <defs>
                  <clipPath id="dream-clip">
                    <path id="dream-mask" d="M194 126 H206 V134 H194 Z" />
                  </clipPath>
                  <path id="mask-closed" d="M194 126 H206 V134 H194 Z" />
                  <path id="mask-open" d="M16 16 Q16 4 28 4 H372 Q384 4 384 16 V244 Q384 256 372 256 H28 Q16 256 16 244 Z" />
                </defs>
                <image
                  href="mood references/8a39c11b13e725e197139d8c31e06e8a.jpg"
                  width="400"
                  height="260"
                  preserveAspectRatio="xMidYMid slice"
                  clip-path="url(#dream-clip)"
                />
              </svg>

              <div class="voice-note" id="voice-note">
                <button class="play-button" id="play-button" type="button" aria-label="Play voice message">
                  <span class="play-icon" aria-hidden="true"></span>
                </button>
                <div class="voice-copy">
                  <strong>Sam, from the soft place</strong>
                  <span id="voice-time">0:00 / 0:12</span>
                </div>
                <div class="waveform" id="waveform" aria-hidden="true">
                  <span></span><span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span><span></span>
                  <i id="wave-progress"></i>
                </div>
              </div>
            </div>

            <button
              class="parcel-lid paper-texture"
              id="parcel-button"
              type="button"
              aria-expanded="false"
              aria-controls="parcel-reveal"
            >
              <span class="packing-tape" aria-hidden="true"></span>
              <span class="address-label">
                <span class="parcel-meta">For June</span>
                <strong>Open when the sky feels far away</strong>
                <small>From Sam, with one small berry brave thought</small>
              </span>
              <span class="postal-mark" aria-hidden="true">XO</span>
            </button>
          </div>
        </div>

        <div class="parcel-footer">
          <p class="parcel-status" id="flow-status" aria-live="polite">
            Paper parcel. Packed 12 minutes ago.
          </p>
          <button class="fold-button" id="fold-button" type="button" hidden>Fold it closed</button>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/MorphSVGPlugin.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
