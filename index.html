<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postie - Strawberry Mail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=MonteCarlo&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <img
            class="wordmark-image"
            src="assets/postie-wordmark.png"
            alt="Postie"
          />
          <p class="parcel-meta">Strawberry Mail</p>
        </div>

        <div class="mail-stage" aria-live="polite">
          <div class="sky-window">
            <div class="dream-grid"></div>
            <div class="cloud cloud-one"></div>
            <div class="cloud cloud-two"></div>
            <div class="glass-mailbox" id="mailbox">
              <span class="mailbox-flag" aria-hidden="true"></span>
              <span class="mailbox-screen">New parcel</span>
              <span class="mailbox-slot"></span>
            </div>
          </div>
          <div class="stage-copy">
            <h1 id="app-title" class="brand-wordmark">Postie</h1>
            <p class="parcel-status" id="stage-status">
              There is something soft waiting in your mailbox.
            </p>
          </div>
        </div>
      </section>

      <section class="workspace" aria-label="Postie app">
        <div class="screen is-active" id="screen-mailbox">
          <div class="panel-heading">
            <p class="parcel-meta">Good morning, June</p>
            <h2 class="parcel-title" id="flow-title">
              There is a berry important delivery.
            </h2>
            <p class="parcel-body" id="flow-copy">
              Open it, wrap a reply, then pop it into the little digital post.
            </p>
          </div>

          <div class="parcel-theater" aria-label="Animated parcel">
            <svg
              class="parcel-svg"
              viewBox="0 0 520 360"
              role="img"
              aria-labelledby="parcel-svg-title parcel-svg-desc"
            >
              <title id="parcel-svg-title">Animated Postie parcel</title>
              <desc id="parcel-svg-desc">
                A parcel opens into a message and folds back into a wrapped reply.
              </desc>
              <defs>
                <path
                  id="shape-closed"
                  d="M105 105 C105 82 124 70 152 70 L368 70 C396 70 415 82 415 105 L415 245 C415 278 394 292 360 292 L160 292 C126 292 105 278 105 245 Z"
                />
                <path
                  id="shape-open"
                  d="M100 196 C119 150 146 115 178 94 C220 66 300 66 342 94 C374 115 401 150 420 196 L374 292 L146 292 Z"
                />
                <path
                  id="shape-wrapped"
                  d="M132 92 C153 78 367 78 388 92 L424 132 L388 286 C367 300 153 300 132 286 L96 132 Z"
                />
                <path
                  id="shape-mailed"
                  d="M188 124 C205 111 315 111 332 124 L372 166 L332 252 C315 265 205 265 188 252 L148 166 Z"
                />
              </defs>
              <path
                id="parcel-shape"
                class="parcel-shape"
                d="M105 105 C105 82 124 70 152 70 L368 70 C396 70 415 82 415 105 L415 245 C415 278 394 292 360 292 L160 292 C126 292 105 278 105 245 Z"
              />
              <path
                id="parcel-flap"
                class="parcel-flap"
                d="M114 114 L260 214 L406 114"
              />
              <path
                id="thread-wave"
                class="thread-wave"
                d="M150 224 C178 184 201 262 230 222 C260 180 286 262 318 220 C345 184 368 245 392 212"
              />
              <rect id="parcel-tape-svg" class="parcel-tape-svg" x="242" y="87" width="36" height="202" rx="10" />
              <g id="parcel-label-svg" class="parcel-label-svg">
                <rect x="176" y="148" width="168" height="58" rx="8" />
                <text x="260" y="181" text-anchor="middle">Open when you miss me</text>
              </g>
              <g id="postal-stamp" class="postal-stamp">
                <circle cx="370" cy="118" r="24" />
                <text x="370" y="123" text-anchor="middle">XO</text>
              </g>
            </svg>
          </div>

          <div class="timeline-meter" aria-hidden="true">
            <span class="meter-step is-active">Receive</span>
            <span class="meter-step">Open</span>
            <span class="meter-step">Wrap</span>
            <span class="meter-step">Send</span>
          </div>

          <div class="button-row">
            <button class="primary-button script-cta" type="button" id="open-button">
              Open parcel
            </button>
            <button class="primary-button script-cta" type="button" id="wrap-button">
              Wrap reply
            </button>
            <button class="secondary-button" type="button" id="send-button">
              Pop it in the post
            </button>
            <button class="secondary-button" type="button" id="reset-button">
              Reset
            </button>
          </div>
          <p class="parcel-status" id="flow-status">
            Special delivery from Sam. Packed 12 minutes ago.
          </p>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/MorphSVGPlugin.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
